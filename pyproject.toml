[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-monik"
version = "0.1.0"
description = "Local read-only Codex Observatory"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.2", "uvicorn==0.48.0"]

[project.scripts]
monik = "monik.cli:main"

[tool.setuptools.packages.find]
include = ["monik*"]

[tool.setuptools.package-data]
monik = ["web/*"]
